name: OLGA Frontend Quality Audit

on:
  push:
    branches:
      - preview/soni-development
      - "audit/**"
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "vercel.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "vercel.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/frontend-quality.yml"

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check services, article slugs and image assets
        run: node scripts/verify-content.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production static build
        run: npm run build
      - name: Verify all static routes, metadata, assets and safe export
        run: node scripts/verify-export.mjs
